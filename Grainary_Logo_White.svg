<svg width="1360" height="840" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Grainary — Light version logo</title>
<desc>Grainary rice brand logo on white/cream background</desc>
<defs>
  <style>
    .wordmark { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 64px; fill: #1A5C2A; letter-spacing: 2px; }
    .tagline  { font-family: Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #5a8a64; letter-spacing: 6px; }
    .sub      { font-family: Arial, sans-serif; font-size: 11px; fill: #2a6e3a; letter-spacing: 1px; }
    .url      { font-family: Georgia, serif; font-size: 13px; fill: #C8970A; font-style: italic; }
    .loc      { font-family: Arial, sans-serif; font-size: 11px; fill: #5a8a64; letter-spacing: 2px; }
  </style>
</defs>

<rect width="680" height="420" fill="#FFF8E7" rx="16"/>
<rect x="40" y="40" width="600" height="340" fill="none" stroke="#d4c8a8" stroke-width="0.5" rx="12"/>

<g transform="translate(340,118)">
  <ellipse cx="0" cy="0" rx="52" ry="52" fill="#1A5C2A" opacity="0.08"/>
  <ellipse cx="0" cy="0" rx="42" ry="42" fill="#1A5C2A" opacity="0.12"/>
  <line x1="0" y1="36" x2="0" y2="-36" stroke="#1A5C2A" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="-10" cy="-28" rx="7" ry="12" fill="#C8970A" transform="rotate(-25 -10 -28)"/>
  <ellipse cx="10"  cy="-20" rx="7" ry="12" fill="#C8970A" transform="rotate(25 10 -20)"/>
  <ellipse cx="-9"  cy="-10" rx="7" ry="12" fill="#a87a0a" transform="rotate(-20 -9 -10)"/>
  <ellipse cx="9"   cy="-2"  rx="7" ry="12" fill="#a87a0a" transform="rotate(20 9 -2)"/>
  <ellipse cx="-7"  cy="8"   rx="6" ry="10" fill="#C8970A" transform="rotate(-15 -7 8)"/>
  <ellipse cx="7"   cy="14"  rx="6" ry="10" fill="#C8970A" transform="rotate(15 7 14)"/>
  <ellipse cx="0"   cy="-34" rx="5" ry="9"  fill="#a87a0a"/>
  <line x1="-4" y1="24" x2="-18" y2="36" stroke="#2a8a3e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4"  y1="28" x2="16"  y2="40" stroke="#2a8a3e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="-18" cy="36" r="2.5" fill="#2a8a3e"/>
  <circle cx="16"  cy="40" r="2.5" fill="#2a8a3e"/>
</g>

<text x="340" y="222" text-anchor="middle" class="wordmark">Grainary</text>

<line x1="140" y1="242" x2="260" y2="242" stroke="#d4c8a8" stroke-width="0.5"/>
<circle cx="340" cy="242" r="3" fill="#C8970A"/>
<line x1="420" y1="242" x2="540" y2="242" stroke="#d4c8a8" stroke-width="0.5"/>

<text x="340" y="272" text-anchor="middle" class="tagline">FARM TO YOUR KITCHEN</text>

<rect x="240" y="295" width="200" height="28" rx="4" fill="none" stroke="#d4c8a8" stroke-width="0.5"/>
<text x="340" y="313" text-anchor="middle" class="sub">SOUTH INDIA'S PREMIUM RICE BRAND</text>

<g transform="translate(108,340)">
  <line x1="4" y1="-6" x2="4" y2="14" stroke="#2a8a3e" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="0" cy="0" rx="4" ry="6" fill="#C8970A" transform="rotate(-30 0 0)"/>
  <ellipse cx="8" cy="2" rx="4" ry="6" fill="#C8970A" transform="rotate(20 8 2)"/>
  <ellipse cx="4" cy="9" rx="3" ry="5" fill="#a87a0a" transform="rotate(-10 4 9)"/>
</g>
<g transform="translate(564,340)">
  <line x1="4" y1="-6" x2="4" y2="14" stroke="#2a8a3e" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="0" cy="0" rx="4" ry="6" fill="#C8970A" transform="rotate(-30 0 0)"/>
  <ellipse cx="8" cy="2" rx="4" ry="6" fill="#C8970A" transform="rotate(20 8 2)"/>
  <ellipse cx="4" cy="9" rx="3" ry="5" fill="#a87a0a" transform="rotate(-10 4 9)"/>
</g>

<text x="340" y="355" text-anchor="middle" class="loc">BANGALORE · INDIA · EST. 2026</text>
<text x="340" y="380" text-anchor="middle" class="url">grainary.in</text>
